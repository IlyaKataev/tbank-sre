name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Unit tests
        run: make test
      - name: PostgreSQL integration tests
        run: make test-e2e
      - name: Build and start
        run: |
          make env
          make build
          make up
      - name: HTTP smoke test
        run: make smoke
      - name: Application logs
        if: always()
        run: docker compose logs --no-color app migrate
      - name: Stop
        if: always()
        run: docker compose down
