# Requires Docker Compose >= 2.24.4 for !reset.
services:
  app:
    ports: !reset []
  proxy:
    image: nginx:1.28.2-alpine3.23
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
