name: tbank-sre

x-app-environment: &app-environment
  DB_DSN: postgres://marketplace:${POSTGRES_PASSWORD:?Run make env first}@db:5432/marketplace?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?Run make env first}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
  ORDER_RATE_LIMIT_MINUTES: ${ORDER_RATE_LIMIT_MINUTES:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_PORT: "8080"
  DB_CONNECT_TIMEOUT: 10s
  SHUTDOWN_TIMEOUT: 10s
  READY_TIMEOUT: 2s

services:
  db:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env first}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: ${APP_IMAGE:-tbank-sre:local}
    command: ["/app/migrate", "up"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  app:
    image: ${APP_IMAGE:-tbank-sre:local}
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
